services:
  postgres:
    image: postgres:16-alpine
    container_name: spa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spa_do_cilios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  beta:
    build:
      context: ./beta
    container_name: spa_beta
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spa_do_cilios?schema=public
      CORS_ORIGIN: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "4000:4000"

  alpha:
    build:
      context: ./alpha
    container_name: spa_alpha
    restart: unless-stopped
    depends_on:
      - beta
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
